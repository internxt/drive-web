name: Drive Web CI
on:
  pull_request:
    branches: [master]
env:
  REACT_APP_STORJ_BRIDGE: ${{ secrets.REACT_APP_STORJ_BRIDGE }}
  REACT_APP_CRYPTO_SECRET: ${{ secrets.REACT_APP_CRYPTO_SECRET }}
  REACT_APP_STRIPE_PK: ${{ secrets.REACT_APP_STRIPE_PK }}
  REACT_APP_STRIPE_TEST_PK: ${{ secrets.REACT_APP_STRIPE_TEST_PK }}
  REACT_APP_SEGMENT_KEY: ${{ secrets.REACT_APP_SEGMENT_KEY }}
  REACT_APP_RECAPTCHA_V3: ${{ secrets.REACT_APP_RECAPTCHA_V3 }}
  REACT_APP_TURNSTILE_SITE_KEY: ${{ secrets.REACT_APP_TURNSTILE_SITE_KEY }}
  REACT_APP_TURNSTILE_ENABLED: ${{ secrets.REACT_APP_TURNSTILE_ENABLED }}
  GENERATE_SOURCEMAP: ${{ secrets.GENERATE_SOURCEMAP }}
  CI: false

jobs:
  version-bump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.CI_USER_GH_TOKEN || github.token }}

      - name: Bump version if the PR did not
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          CAN_PUSH: ${{ secrets.CI_USER_GH_TOKEN != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          base=$(git show "origin/$BASE_REF:package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          head=$(node -p "require('./package.json').version")
          echo "base: $base, head: $head"

          highest=$(printf '%s\n%s\n' "${base#v}" "${head#v}" | sort -V | tail -n1)
          if [ "$head" != "$base" ] && [ "$highest" = "${head#v}" ]; then
            echo "Version already bumped"
            exit 0
          fi

          if [ "$CAN_PUSH" != "true" ]; then
            echo "::error file=package.json::Bump the version in package.json (currently $head, $BASE_REF has $base)"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${base#v}"
          next="v${major}.${minor}.$((patch + 1))"
          NEXT="$next" node -e '
            const fs = require("fs");
            const pkg = fs.readFileSync("package.json", "utf8");
            const updated = pkg.replace(/("version":\s*")[^"]+(")/, `$1${process.env.NEXT}$2`);
            if (updated === pkg) throw new Error("version field not found");
            fs.writeFileSync("package.json", updated);
          '

          git config user.name "inxtci"
          git config user.email "inxtci@internxt.com"
          git commit -am "chore: bump version to ${next}"
          git push origin "HEAD:${HEAD_REF}"

  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: echo REACT_APP_CRYPTO_SECRET=${{ secrets.REACT_APP_CRYPTO_SECRET }} >> ./.env
      - run: echo REACT_APP_STRIPE_PK=${{ secrets.REACT_APP_STRIPE_PK }} >> ./.env
      - run: echo REACT_APP_STRIPE_TEST_PK=${{ secrets.REACT_APP_STRIPE_TEST_PK }} >> ./.env
      - run: echo REACT_APP_SEGMENT_KEY=${{ secrets.REACT_APP_SEGMENT_KEY }} >> ./.env
      - run: echo GENERATE_SOURCEMAP=${{ secrets.GENERATE_SOURCEMAP }} >> ./.env
      - run: echo REACT_APP_RECAPTCHA_V3=${{ secrets.REACT_APP_RECAPTCHA_V3 }} >> ./.env
      - run: echo REACT_APP_TURNSTILE_SITE_KEY=${{ secrets.REACT_APP_TURNSTILE_SITE_KEY }} >> ./.env
      - run: echo REACT_APP_TURNSTILE_ENABLED=${{ secrets.REACT_APP_TURNSTILE_ENABLED }} >> ./.env
      - run: echo REACT_APP_STORJ_BRIDGE=${{ secrets.REACT_APP_STORJ_BRIDGE }} >> ./.env
      - run: echo REACT_APP_HOSTNAME=${{ secrets.REACT_APP_HOSTNAME }} >> ./.env
      - run: echo REACT_APP_PROXY=${{ secrets.REACT_APP_PROXY }} >> ./.env
      - run: echo REACT_APP_DONT_USE_PROXY=${{ secrets.REACT_APP_DONT_USE_PROXY }} >> ./.env
      - run: echo REACT_APP_PAYMENTS_API_URL=${{ secrets.REACT_APP_PAYMENTS_API_URL }} >> ./.env
      - run: echo REACT_APP_DRIVE_NEW_API_URL=${{ secrets.REACT_APP_DRIVE_NEW_API_URL }} >> ./.env
      - run: echo REACT_APP_CELLO_PRODUCT_ID=${{ secrets.REACT_APP_CELLO_PRODUCT_ID }} >> ./.env
      - run: echo REACT_APP_CELLO_ASSETS_URL=${{ secrets.REACT_APP_CELLO_ASSETS_URL }} >> ./.env
      - run: echo REACT_APP_NODE_ENV=production >> ./.env

      - name: Install
        run: yarn

      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps

      - name: Unit test run
        run: yarn test

  typecheck:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: yarn

      - name: Typecheck
        run: yarn typecheck

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: yarn

      - name: Build
        run: yarn build
        env:
          CI: false
